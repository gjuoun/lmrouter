version: '3.8'

services:
  lmrouter:
    build:
      context: .
      dockerfile: Dockerfile
    image: lmrouter:latest
    container_name: lmrouter
    ports:
      - "3000:3000"
    volumes:
      # Mount local config directory to container
      # This allows you to edit config/config.yaml locally and changes will sync
      - ./config:/app/config
    environment:
      # Optional: Set environment variables here if needed
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Optional: Development service with hot reload
  lmrouter-dev:
    build:
      context: .
      target: base
      dockerfile: Dockerfile
    image: lmrouter:dev
    container_name: lmrouter-dev
    ports:
      - "3001:3000"
    volumes:
      # Mount source code for development
      - ./src:/app/src
      - ./config:/app/config
      # Prevent overwriting node_modules
      - /app/node_modules
    command: ["bun", "--watch", "src/index.ts", "config/config.yaml"]
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    profiles:
      - dev

# Optional: Add Redis service for responses_store
  # Uncomment to use Redis instead of in_memory for responses API
  # Then update config.yaml:
  #   responses_store:
  #     type: upstash_redis
  #     url: redis://redis:6379
  #     token: ""
  redis:
    image: redis:7-alpine
    container_name: lmrouter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - redis

  # Optional: Add database service if auth is enabled
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: lmrouter-db
  #   environment:
  #     POSTGRES_USER: lmrouter
  #     POSTGRES_PASSWORD: changeme
